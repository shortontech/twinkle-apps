[workspace]
resolver = "3"
members = [
    "apps/twinkle-notes",
    "apps/twinkle-security",
    "apps/twinkle-blocks",
    "apps/twinkle-blocks-jsx",
    "benchmarks/iced-blocks",
    "benchmarks/twinkle",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
twinkle-charts = { git = "https://github.com/shortontech/twinkle.git", rev = "870f7a991c3f98264e94841fe91b7af2d3250190" }
twinkle-ui = { git = "https://github.com/shortontech/twinkle.git", rev = "870f7a991c3f98264e94841fe91b7af2d3250190" }
twinkle-presentation = { git = "https://github.com/shortontech/twinkle.git", rev = "870f7a991c3f98264e94841fe91b7af2d3250190", features = ["jsx"] }
twinkle-jsx-runtime = { git = "https://github.com/shortontech/twinkle.git", rev = "870f7a991c3f98264e94841fe91b7af2d3250190" }
twinkle-protocol = { git = "https://github.com/shortontech/twinkle.git", rev = "870f7a991c3f98264e94841fe91b7af2d3250190" }
serde_json = "1"
iced = { version = "0.14", features = ["smol"] }

twinkle-redux = { git = "https://github.com/shortontech/twinkle.git", rev = "870f7a991c3f98264e94841fe91b7af2d3250190" }
twinkle-redux-jsx = { git = "https://github.com/shortontech/twinkle.git", rev = "870f7a991c3f98264e94841fe91b7af2d3250190" }
