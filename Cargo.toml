[workspace]
resolver = "3"
members = ["apps/twinkle-notes", "apps/twinkle-blocks"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
twinkle-ui = { path = "../twinkle/crates/twinkle" }
twinkle-presentation = { path = "../twinkle/crates/twinkle-presentation", features = ["jsx"] }
twinkle-jsx-runtime = { path = "../twinkle/crates/twinkle-jsx-runtime" }
twinkle-protocol = { path = "../twinkle/crates/twinkle-protocol" }
serde_json = "1"
