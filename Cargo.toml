[workspace]
resolver = "3"
members = [
    "apps/twinkle-notes",
    "apps/twinkle-blocks",
    "apps/twinkle-blocks-jsx",
    "benchmarks/iced-blocks",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
twinkle-ui = { git = "https://github.com/shortontech/twinkle.git", rev = "8a37587aef2b5c73203c45fab97a21ef52f82da4" }
twinkle-presentation = { git = "https://github.com/shortontech/twinkle.git", rev = "8a37587aef2b5c73203c45fab97a21ef52f82da4", features = ["jsx"] }
twinkle-jsx-runtime = { git = "https://github.com/shortontech/twinkle.git", rev = "8a37587aef2b5c73203c45fab97a21ef52f82da4" }
twinkle-protocol = { git = "https://github.com/shortontech/twinkle.git", rev = "8a37587aef2b5c73203c45fab97a21ef52f82da4" }
serde_json = "1"
iced = { version = "0.14", features = ["smol"] }
