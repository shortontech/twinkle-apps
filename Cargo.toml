[workspace]
resolver = "3"
members = [
    "apps/twinkle-notes",
    "apps/twinkle-security",
    "apps/twinkle-blocks",
    "apps/twinkle-blocks-jsx",
    "benchmarks/iced-blocks",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
twinkle-charts = { git = "https://github.com/shortontech/twinkle.git", rev = "ab1f554f5c0baf829e32d38567793ef4af8c259c" }
twinkle-ui = { git = "https://github.com/shortontech/twinkle.git", rev = "ab1f554f5c0baf829e32d38567793ef4af8c259c" }
twinkle-presentation = { git = "https://github.com/shortontech/twinkle.git", rev = "ab1f554f5c0baf829e32d38567793ef4af8c259c", features = ["jsx"] }
twinkle-jsx-runtime = { git = "https://github.com/shortontech/twinkle.git", rev = "ab1f554f5c0baf829e32d38567793ef4af8c259c" }
twinkle-protocol = { git = "https://github.com/shortontech/twinkle.git", rev = "ab1f554f5c0baf829e32d38567793ef4af8c259c" }
serde_json = "1"
iced = { version = "0.14", features = ["smol"] }
