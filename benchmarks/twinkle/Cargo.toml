[package]
name = "twinkle-benchmarks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
autobins = false

[features]
default = []
jsx = []
charts = ["twinkle-presentation/charts"]
pipeline-allocator = ["jsx"]
pipeline-attribution = ["twinkle-ui/pipeline-attribution", "twinkle-jsx-runtime/pipeline-attribution"]

[dependencies]
twinkle-ui.workspace = true
twinkle-charts.workspace = true
twinkle-presentation.workspace = true
twinkle-jsx-runtime.workspace = true
twinkle-protocol.workspace = true
twinkle-redux.workspace = true
twinkle-redux-jsx.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "twinkle-pipeline-bench"
path = "src/bin/twinkle_pipeline_bench.rs"
required-features = ["jsx"]

[[bin]]
name = "twinkle-chart-dashboard"
path = "src/bin/twinkle_chart_dashboard.rs"
required-features = ["charts"]

[[bin]]
name = "twinkle-chart-admission"
path = "src/bin/twinkle_chart_admission.rs"
required-features = ["charts", "pipeline-allocator"]

[[bin]]
name = "twinkle-chart-measure"
path = "src/bin/chart_workloads/measure.rs"
required-features = ["charts"]

[[bin]]
name = "twinkle-compound-admission"
path = "src/bin/twinkle_compound_admission.rs"
required-features = ["jsx"]

[[bin]]
name = "twinkle-redux-measure"
path = "src/bin/twinkle_redux_measure.rs"

[[bin]]
name = "twinkle-redux-jsx-measure"
path = "src/bin/twinkle_redux_jsx_measure.rs"
required-features = ["jsx"]
